# Пересобирает французскую и русскую копии страниц (fr/, ru/) и sitemap.xml,
# когда на GitHub меняются английские страницы или переводы (assets/js/i18n.js).
# Подробнее — в tools/build-languages.mjs.
name: Build fr/ru pages

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/js/i18n.js'
      - 'tools/build-languages.mjs'
  pull_request:
    paths:
      - '*.html'
      - 'fr/**'
      - 'ru/**'
      - 'assets/js/i18n.js'
      - 'tools/build-languages.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  # В pull request — только проверка, что копии собраны
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-languages.mjs --check

  # В main — собрать и сохранить, если что-то изменилось
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-languages.mjs
      - name: Commit rebuilt pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Всё уже собрано."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fr ru sitemap.xml ./*.html
          git commit -m "Rebuild fr/ru pages"
          git push
          # Коммит от бота сам не запускает сборку GitHub Pages — просим её явно
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
